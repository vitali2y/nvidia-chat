[package]
name = "nvidia-chat"
description = "Simple Rust CLI AI chat via Nvidia AI API"
authors = ["Vi+ <vitaliyy@gmail.com>"]
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.13", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
